name: Testimony + Motivation Rotator

on:
  workflow_dispatch: {}   # triggered automatically by cron-job.org every 30 minutes

# Prevent overlapping runs from racing on pool.json
concurrency:
  group: rotator-bot
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run rotator bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          NEW_CHANNEL_ID: ${{ secrets.NEW_CHANNEL_ID }}
          OLD_CHANNEL_ID: ${{ secrets.OLD_CHANNEL_ID }}
        run: python fetch_and_post.py

      - name: Commit updated pool.json
        run: |
          git config user.name "rotator-bot"
          git config user.email "rotator-bot@users.noreply.github.com"
          git add pool.json
          git diff --staged --quiet || git commit -m "Update pool.json [skip ci]"
          git push
